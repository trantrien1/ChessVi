name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,data]"

      - name: Run pytest
        # Không có binary Stockfish/Maia trên runner — test engine tự skip.
        # Kết quả được đẩy vào job summary, và khi đỏ thì vào cả annotation,
        # để xem được ngay ở trang PR mà không phải mở log đầy đủ.
        run: |
          set +e
          pytest -q > pytest.log 2>&1
          code=$?
          cat pytest.log
          {
            echo "## pytest (exit $code)"
            echo '```'
            tail -n 150 pytest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ]; then
            message=$(tail -n 60 pytest.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=pytest exit $code::$message"
          fi
          exit $code

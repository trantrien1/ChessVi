name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,data]"

      - name: Run pytest
        # Không có binary Stockfish/Maia trên runner — test engine tự skip.
        # Log được đẩy vào job summary để đọc kết quả mà không phải mở log đầy đủ.
        run: |
          set +e
          pytest -q > pytest.log 2>&1
          code=$?
          {
            echo "## pytest (exit $code)"
            echo '```'
            tail -n 120 pytest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat pytest.log
          exit $code

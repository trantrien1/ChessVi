[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "chessvi"
version = "0.1.0"
description = "Trợ lý cờ vua tiếng Việt: chatbot giải thích nước đi + đối thủ AI theo mức Elo"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "chess-vi" }]

dependencies = [
    "chess==1.11.2",
]

[project.optional-dependencies]
# Cận dưới của datasets và huggingface-hub KHÔNG tuỳ tiện: chúng là ràng buộc
# cứng của trl/vllm bên dưới. Hạ xuống là pip báo ResolutionImpossible, không
# phải cảnh báo — cả extra sẽ không cài được.
data = [
    "datasets==4.8.5",       # trl 1.13.0 đòi datasets>=4.7.0
    "huggingface-hub==1.31.0",  # vllm 0.28.0 đòi huggingface_hub>=1.27.0
    "pyarrow==23.0.0",
    "pandas==2.3.3",
]
train = [
    "transformers==5.5.4",
    "peft==0.20.0",
    "trl==1.13.0",
    "accelerate==1.15.0",
    "bitsandbytes==0.50.2",
    "datasets==4.8.5",       # phải khớp extra data ở trên
]
# Chỉ dùng trên Colab khi rollout GRPO. KHÔNG cài local (4GB VRAM sẽ OOM).
# Vì sao 0.28.0 chứ không phải bản mới nhất: trl 1.13.0 khai báo
# `vllm<=0.28.0` trong extra vllm, và vllm 0.29.0 lại đòi transformers>=5.10.4
# — hai điều đó cộng lại khiến 0.29.0 không thể cùng tồn tại với stack này.
# Nâng vllm thì phải nâng cả trl lẫn transformers cùng lúc.
rl = [
    "vllm==0.28.0",
]
serve = [
    "llama-cpp-python==0.3.35",
]
dev = [
    "pytest==9.1.1",
    "hypothesis==6.168.0",
]

[project.scripts]
chessvi-chat = "chessvi.serve.chat:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chessvi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Test import `tests.conftest` để dùng chung FEN cố định. `python -m pytest` tự
# đưa thư mục hiện tại vào sys.path còn `pytest` trần thì không, nên phải khai
# báo ở đây — nếu không CI (chạy `pytest`) sẽ chết ngay ở bước collect.
pythonpath = ["."]
markers = [
    "engine: cần binary UCI engine (Stockfish/Maia) — tự skip nếu thiếu",
]
